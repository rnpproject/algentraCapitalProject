name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: gitleaks.toml
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Audit web dependencies
        working-directory: apps/web
        run: npm audit --audit-level=moderate
      - name: Type check web
        working-directory: apps/web
        run: npm run typecheck
      - name: Build web
        working-directory: apps/web
        run: npm run build

  golang:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      - name: Check Go formatting
        shell: bash
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Test Go packages
        run: go test ./...
      - name: Build Windows executable
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: go build -ldflags="-s -w" -o algentra-backend.exe ./cmd/algentra-backend
      - name: Build managed copier executables
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          go build -ldflags="-s -w" -o algentra-copier-master.exe ./cmd/copier-master
          go build -ldflags="-s -w" -o algentra-copier-launcher.exe ./cmd/copier-launcher
          go build -ldflags="-s -w" -o algentra-mt5-login-probe.exe ./cmd/mt5-login-probe
          go build -ldflags="-s -w" -o algentra-copier-worker.exe ./cmd/copier-worker
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: algentra-backend-windows-amd64
          path: algentra-backend.exe
          if-no-files-found: error
          retention-days: 7

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/contracts/package-lock.json
      - name: Generate TypeScript contract types
        working-directory: packages/contracts
        run: npm ci && npm run generate:types
      - name: Check generated contracts are current
        run: git diff --exit-code -- packages/contracts/openapi.json packages/contracts/src/generated.d.ts
