name: CI

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Audit web dependencies
        working-directory: apps/web
        run: npm audit --audit-level=moderate
      - name: Type check web
        working-directory: apps/web
        run: npm run typecheck
      - name: Build web
        working-directory: apps/web
        run: npm run build

  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/core-api/requirements.txt
            apps/core-api/requirements-dev.txt
            apps/copier-worker/requirements.txt
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/core-api/requirements-dev.txt
          python -m pip install -r apps/copier-worker/requirements.txt
      - name: Lint Python
        run: ruff check apps/core-api/app apps/copier-worker/src
      - name: Check Python formatting
        run: ruff format --check apps/core-api/app apps/copier-worker/src
      - name: Type check domain
        run: mypy --strict apps/core-api/app/domain
      - name: Audit Python dependencies
        run: pip-audit
      - name: Export OpenAPI contract
        working-directory: apps/core-api
        env:
          APP_ENV: test
          APP_SECRET_KEY: m1-test-secret-key-at-least-thirty-two-characters
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: M1-Testing-Password-123
          EA_API_KEY: m4-test-ea-api-key-32-characters-long
          DATABASE_URL: sqlite://
          COOKIE_SECURE: "false"
        run: python -m app.export_openapi
      - name: Generate TypeScript contract types
        working-directory: packages/contracts
        run: |
          npm ci
          npm run generate:types
      - name: Check generated contracts are current
        run: git diff --exit-code -- packages/contracts/openapi.json packages/contracts/src/generated.d.ts
      - name: Test core API
        working-directory: apps/core-api
        run: python -m pytest tests
      - name: Test copier worker
        working-directory: apps/copier-worker
        run: python -m pytest tests
